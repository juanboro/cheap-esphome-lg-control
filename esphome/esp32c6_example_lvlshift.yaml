substitutions: 
  name: esp32c6-dev-fillin
  friendly_name: Fill This in
# adjust pins as necessary
  tx_pin: 16
  rx_pin: 17

esphome:
  name: $name
  friendly_name: $friendly_name

esp32:
  board: esp32-c6-devkitc-1
  flash_size: 4MB
  framework:
    type: esp-idf

esp32_ble_tracker:
#  scan_parameters:
#    active: false

bluetooth_proxy:
#  active: false

wifi:
  ssid: !secret wifi_name
  password: !secret wifi_pass
  fast_connect: true
  ap:
    ssid: "ap-$name"
    password: !secret wifi_pass

ota:
  platform: esphome
  on_begin:
    - globals.set:
        id: firmware_update
        value: 'true'
    - switch.turn_on: blueled_switch
  on_end:
    - globals.set:
        id: firmware_update
        value: 'false'
    - switch.turn_off: blueled_switch

captive_portal:

globals:
  - id: firmware_update
    type: bool
    restore_value: no
    initial_value: 'false'

interval:
  - interval: 500ms
    then:
      - if:
          condition:
            lambda: 'return id(firmware_update);'
          then:
            - switch.turn_on: blueled_switch
          else:
            - if:
                condition:
                  wifi.connected:
                then:
                  - switch.turn_off: blueled_switch
                else:
                  - switch.toggle: blueled_switch

logger:
  level: INFO
#  level: DEBUG
#  level: VERBOSE
#  level: VERY_VERBOSE

packages: 
  lgcontroller:
    url: https://github.com/juanboro/cheap-esphome-lg-control
    ref: main
    files:
      - path: esphome/lg_controller.yaml
        vars: { rx_pin: $rx_pin, rx_inverted: true, uart_id: ac_serial }

uart:
  id: ac_serial
  tx_pin: { number: $tx_pin , inverted: true }
  rx_pin: { number: $rx_pin , allow_other_uses: true, inverted: true , mode: { input: true, pullup: true} }
  baud_rate: 104

time:
  - platform: homeassistant
    id: homeassistant_time

script:
  - id: update_led_status
    mode: restart
    then:
      - if:
          condition:
            binary_sensor.is_on: defrost
          then:
            - if:
                condition:
                  lambda: 'return id(ledstatus).get_effect_name() != "Defrost";'
                then:
                  - light.turn_on:
                      id: ledstatus
                      effect: "Defrost"
          else:
            - if:
                condition:
                  lambda: 'return id(lg_control).mode == climate::CLIMATE_MODE_HEAT;'
                then:
                  - light.turn_on:
                      id: ledstatus
                      effect: "None"
                      red: 100%
                      green: 0%
                      blue: 0%
            - if:
                condition:
                  lambda: 'return id(lg_control).mode == climate::CLIMATE_MODE_COOL;'
                then:
                  - light.turn_on:
                      id: ledstatus
                      effect: "None"
                      red: 0%
                      green: 0%
                      blue: 100%
            - if:
                condition:
                  lambda: 'return id(lg_control).mode == climate::CLIMATE_MODE_FAN_ONLY;'
                then:
                  - light.turn_on:
                      id: ledstatus
                      effect: "None"
                      red: 100%
                      green: 100%
                      blue: 100%
            - if:
                condition:
                  lambda: 'return id(lg_control).mode == climate::CLIMATE_MODE_DRY;'
                then:
                  - light.turn_on:
                      id: ledstatus
                      effect: "None"
                      red: 100%
                      green: 100%
                      blue: 0%
            - if:
                condition:
                  lambda: 'return id(lg_control).mode == climate::CLIMATE_MODE_OFF;'
                then:
                  - light.turn_on:
                      id: ledstatus
                      effect: "None"
                      red: 0%
                      green: 20%
                      blue: 0%
            - if:
                condition:
                  binary_sensor.is_on: outdoor
                then:
                  - light.turn_on:
                      id: ledstatus
                      brightness: 100%
                else:
                  - light.turn_on:
                      id: ledstatus
                      brightness: 25%

# Set the status LED color and brightness based on state of the controller
climate:
  - id: !extend lg_control
    name: "Living Room LG controller"
    outdoor:
      name: Outdoor Unit
      id: outdoor
      icon: mdi:fan
      on_state:
        - script.execute: update_led_status
    defrost:
      name: Defrost
      id: defrost
      icon: mdi:snowflake-melt
      on_state:
        - script.execute: update_led_status
    on_state:
      - script.execute: update_led_status

web_server:
  port: 80
  version: 3

api:
#  encryption:
#    key: !secret api_key

light:
  - platform: esp32_rmt_led_strip
    id: ledstatus
    name: Status LED
    pin: GPIO8
    rgb_order: GRB
    num_leds: 1
    chipset: ws2812
    effects:
      - strobe:
          name: "Defrost"
          colors:
            - state: true
              brightness: 100%
              red: 0%
              green: 0%
              blue: 100%
              duration: 1s
            - state: true
              brightness: 100%
              red: 100%
              green: 0%
              blue: 0%
              duration: 1s

switch:
  - platform: gpio
    id: blueled_switch
    pin: GPIO15
    restore_mode: ALWAYS_OFF

sensor:
  - platform: uptime
    type: timestamp
    name: Last Boot
    
button:  
  - platform: restart
    name: "ESP32C6 Restart"
